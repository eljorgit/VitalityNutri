# ───────────────────────────────────────────────────────
# Publish — Example CI/CD workflow for VitalityNutri
# ───────────────────────────────────────────────────────
# This is a TEMPLATE you can adapt to your own registry
# and server. It builds the Docker image and pushes it
# to GitHub Container Registry (GHCR).
#
# How to use:
#   1. Enable Write permission for "packages" in your
#      repo: Settings → Actions → General → Workflow
#      permissions.
#   2. If deploying to a VPS, add secrets (SSH_HOST,
#      SSH_USER, SSH_KEY) and uncomment the deploy step.
# ───────────────────────────────────────────────────────

name: Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    name: Build & Push to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Optional: Deploy to a VPS via SSH ──────────────
