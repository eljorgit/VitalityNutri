name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true


jobs:
  lint:
    name: Lint (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --coverage
        working-directory: frontend
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/

  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/VitalityNutri.slnx
      - run: dotnet build backend/VitalityNutri.slnx --configuration Release --no-restore
      - run: dotnet test backend/VitalityNutri.slnx --configuration Release --no-build

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Check repo visibility
        id: check-visibility
        run: echo "public=${{ github.repository_visibility == 'public' }}" >> $GITHUB_OUTPUT
      - name: Initialize CodeQL
        if: steps.check-visibility.outputs.public == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript-typescript
          queries: +security-extended
      - name: Autobuild
        if: steps.check-visibility.outputs.public == 'true'
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        if: steps.check-visibility.outputs.public == 'true'
        uses: github/codeql-action/analyze@v4

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check SNYK_TOKEN
        id: check-snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: echo "available=$([ -n "$SNYK_TOKEN" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Run Snyk test
        if: steps.check-snyk.outputs.available == 'true'
        uses: snyk/actions@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
      - name: Run Snyk monitor
        if: github.event_name == 'push' && steps.check-snyk.outputs.available == 'true'
        uses: snyk/actions@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: frontend

  sonar:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/
      - name: Check secrets
        id: check-sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "tailscale=$([ -n "$TAILSCALE_AUTHKEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "sonar=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Connect to Tailscale
        if: steps.check-sonar.outputs.tailscale == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: SonarQube Scan
        if: steps.check-sonar.outputs.sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build
    if: github.ref_type == 'tag'
    needs: [lint, test, backend, codeql, snyk, e2e, sonar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet build backend/VitalityNutri.slnx --configuration Release

  docker:
    name: Build & Push Docker Image
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}
          cache-from: type=gha,scope=vitalitynutri-backend
          cache-to: type=gha,mode=max,scope=vitalitynutri-backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.IMAGE_NAME }}-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=vitalitynutri-frontend
          cache-to: type=gha,mode=max,scope=vitalitynutri-frontend
      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha,scope=vitalitynutri
          cache-to: type=gha,mode=max,scope=vitalitynutri

  deploy:
    name: Deploy
    if: github.ref_type == 'tag'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check-deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "tailscale=$([ -n "$TAILSCALE_AUTHKEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "ssh=$([ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Connect to Tailscale
        if: steps.check-deploy.outputs.tailscale == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Copy docker-compose.yml to server
        if: steps.check-deploy.outputs.ssh == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          overwrite: true
      - name: Deploy via SSH
        if: steps.check-deploy.outputs.ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
