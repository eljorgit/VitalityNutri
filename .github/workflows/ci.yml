name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true


jobs:
  compose-validate:
    name: "Infra: Validate Docker Compose (Dev + Release)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate release compose file
        run: docker compose -f docker-compose.release.yml config --quiet

  lint-frontend:
    name: "Frontend: Lint (Type-Check)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-Check (Lint)
        run: npm run lint
        working-directory: frontend

  test-frontend:
    name: "Frontend: Unit Tests & Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Unit Tests with Coverage
        run: npm test -- --coverage
        working-directory: frontend
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/

  backend-test:
    name: "Backend: Build & Tests (.NET 10)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore NuGet Packages
        run: dotnet restore backend/VitalityNutri.slnx
      - name: Build Solution (Release)
        run: dotnet build backend/VitalityNutri.slnx --configuration Release --no-restore
      - name: Execute Tests
        run: dotnet test backend/VitalityNutri.slnx --configuration Release --no-build

  e2e-frontend:
    name: "Frontend: E2E Tests (Playwright)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - name: Run E2E Tests
        run: npm run test:e2e
        working-directory: frontend

  sonar:
    name: "Quality: SonarQube Analysis"
    needs: [compose-validate, lint-frontend, test-frontend, backend-test, e2e-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend
      - name: Build Frontend
        run: npm run build
        working-directory: frontend
      - name: Restore & Build Backend
        run: |
          dotnet restore backend/VitalityNutri.slnx
          dotnet build backend/VitalityNutri.slnx --configuration Release --no-restore
      - name: Download Frontend Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/
      - name: Check Secrets
        id: check-sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "tailscale=$([ -n "$TAILSCALE_AUTHKEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "sonar=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Connect to Tailscale
        if: steps.check-sonar.outputs.tailscale == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: SonarQube Scan
        if: steps.check-sonar.outputs.sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: "Security: CodeQL Analysis"
    needs: [compose-validate, lint-frontend, test-frontend, backend-test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Repo Visibility
        id: check-visibility
        run: echo "public=${{ github.repository_visibility == 'public' }}" >> $GITHUB_OUTPUT
      - name: Initialize CodeQL
        if: steps.check-visibility.outputs.public == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript-typescript
          queries: +security-extended
      - name: Autobuild
        if: steps.check-visibility.outputs.public == 'true'
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        if: steps.check-visibility.outputs.public == 'true'
        uses: github/codeql-action/analyze@v4

  snyk:
    name: "Security: Snyk Scan"
    needs: [compose-validate, lint-frontend, test-frontend, backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Backend NuGet Packages
        run: dotnet restore backend/VitalityNutri.slnx
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend
      - name: Check SNYK_TOKEN
        id: check-snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: echo "available=$([ -n "$SNYK_TOKEN" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Setup Snyk CLI
        if: steps.check-snyk.outputs.available == 'true'
        uses: snyk/actions/setup@master
      - name: Run Snyk Test (All Projects)
        if: steps.check-snyk.outputs.available == 'true'
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Run Snyk Monitor
        if: github.event_name == 'push' && steps.check-snyk.outputs.available == 'true'
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build:
    name: "Build: Frontend & Backend Artifacts"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sonar, codeql, snyk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend
      - name: Build Frontend Production Bundle
        run: npm run build
        working-directory: frontend
      - name: Restore Backend
        run: dotnet restore backend/VitalityNutri.slnx
      - name: Build Backend Solution (Release)
        run: dotnet build backend/VitalityNutri.slnx --configuration Release --no-restore

  docker:
    name: "Publish: Docker Images to GHCR"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}
          cache-from: type=gha,scope=vitalitynutri-backend
          cache-to: type=gha,mode=max,scope=vitalitynutri-backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.IMAGE_NAME }}-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=vitalitynutri-frontend
          cache-to: type=gha,mode=max,scope=vitalitynutri-frontend
      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha,scope=vitalitynutri
          cache-to: type=gha,mode=max,scope=vitalitynutri

  deploy-development:
    name: "Deploy: Development via SSH"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Secrets
        id: check-deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "tailscale=$([ -n "$TAILSCALE_AUTHKEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "ssh=$([ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Connect to Tailscale
        if: steps.check-deploy.outputs.tailscale == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Copy release compose file to server
        if: steps.check-deploy.outputs.ssh == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          overwrite: true
      - name: Deploy via SSH
        if: steps.check-deploy.outputs.ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -f

  deploy-production:
    name: "Deploy: Production via SSH"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy-development
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Secrets
        id: check-deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "tailscale=$([ -n "$TAILSCALE_AUTHKEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "ssh=$([ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Connect to Tailscale
        if: steps.check-deploy.outputs.tailscale == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Copy release compose file to server
        if: steps.check-deploy.outputs.ssh == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.release.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          overwrite: true
      - name: Deploy via SSH
        if: steps.check-deploy.outputs.ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.release.yml pull
            docker compose -f docker-compose.release.yml up -d --remove-orphans
            docker image prune -f
